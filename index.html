<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-title" content="사찰기행">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>주유니의 사찰기행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: seasonal landscape hero, ink map of Korea + journal column, footprints timeline, stamp book. Celadon + lotus pink + seal red on soft paper. */
:root{
  --bg:#f3f3ee; --paper:#ffffff; --ink:#22302c; --ink-soft:#56635d; --mist:#8b958f; --line:#e1e4dd;
  --celadon:#9a6a2c; --celadon-soft:#f8eedf; --seal:#c23d2e; --seal-soft:#fbe5e0; --lotus:#de6d8c; --lotus-soft:#fde8ee; --violet:#b08d64; --leaf:#5c9d4e; --leaf-soft:#e7f2e1; --lotus-2:#f5b2c5; --gold:#c08a2e; --gold-soft:#fbf0d9;
  --sea:#e3ebe9; --sea-line:#d0dcd9; --shadow:0 1px 2px rgba(34,48,44,.05),0 10px 30px rgba(34,48,44,.08);
  --land-spring:#e6eccf; --land-summer:#bcd9b6; --land-autumn:#f1cc9f; --land-winter:#f4f7f8; --border-land:#ffffff;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131917; --paper:#1c2421; --ink:#e8ece6; --ink-soft:#b5bfb9; --mist:#859089; --line:#2e3935;
  --celadon:#e6b96d; --celadon-soft:#3a2f22; --seal:#e66652; --seal-soft:#3b2420; --lotus:#f08fab; --lotus-soft:#3d2430; --gold:#e3b75c; --gold-soft:#3a3020; --violet:#cdaa82; --leaf:#8fcf74; --leaf-soft:#243320; --lotus-2:#f7bccd;
  --sea:#16201d; --sea-line:#22302c; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --land-spring:#4a5340; --land-summer:#33503b; --land-autumn:#6a4a2c; --land-winter:#56616a; --border-land:#1c2421;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131917; --paper:#1c2421; --ink:#e8ece6; --ink-soft:#b5bfb9; --mist:#859089; --line:#2e3935;
  --celadon:#e6b96d; --celadon-soft:#3a2f22; --seal:#e66652; --seal-soft:#3b2420; --lotus:#f08fab; --lotus-soft:#3d2430; --gold:#e3b75c; --gold-soft:#3a3020; --violet:#cdaa82; --leaf:#8fcf74; --leaf-soft:#243320; --lotus-2:#f7bccd;
  --sea:#16201d; --sea-line:#22302c; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --land-spring:#4a5340; --land-summer:#33503b; --land-autumn:#6a4a2c; --land-winter:#56616a; --border-land:#1c2421;
  color-scheme:dark}
:root{--land:var(--land-autumn)}
body[data-season="spring"]{--land:var(--land-spring)}
body[data-season="summer"]{--land:var(--land-summer)}
body[data-season="autumn"]{--land:var(--land-autumn)}
body[data-season="winter"]{--land:var(--land-winter)}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.65;letter-spacing:-.015em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,textarea{font-family:var(--f);letter-spacing:inherit}
button{font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--celadon)}
:focus-visible{outline:3px solid var(--lotus);outline-offset:2px;border-radius:10px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;position:relative;z-index:1}

/* hero */
.hero{position:relative;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);background:var(--paper);min-height:270px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:28px}
.hero-art{position:absolute;inset:0;line-height:0}
.hero-art svg{width:100%;height:100%;display:block}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--paper) 0%,color-mix(in srgb,var(--paper) 88%,transparent) 38%,color-mix(in srgb,var(--paper) 10%,transparent) 72%,transparent 100%)}
.hero>*:not(.hero-art){position:relative;z-index:2}
.greet{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--lotus);background:var(--lotus-soft);padding:6px 14px;border-radius:999px;animation:rise .7s ease both}
h1{font-weight:800;font-size:clamp(36px,6.4vw,58px);line-height:1.12;margin:12px 0 8px;letter-spacing:-.04em;animation:rise .7s .08s ease both}
h1 .yu{background:linear-gradient(120deg,var(--lotus),var(--seal));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink-soft);font-size:17px;margin:0;max-width:30em;animation:rise .7s .16s ease both}
.saying{margin-top:14px;font-size:16px;color:var(--ink);display:flex;gap:10px;align-items:flex-start;max-width:30em;animation:rise .7s .24s ease both}
.saying svg{flex:none;margin-top:3px}
@keyframes rise{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.seasons{display:flex;gap:6px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);padding:6px;border-radius:999px;box-shadow:var(--shadow);align-self:flex-start}
.sz{display:flex;flex-direction:column;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;border:0;background:transparent;transition:background .3s,transform .3s}
.sz b{font-size:20px;line-height:1.1;font-weight:700}
.sz span{font-size:13px;color:var(--ink-soft)}
.sz:hover{transform:translateY(-2px)}
.sz[aria-pressed="true"]{background:var(--celadon);color:#fff}
.sz[data-s="spring"][aria-pressed="true"]{background:linear-gradient(135deg,#f3a6bb,#e27c9a)}
.sz[data-s="summer"][aria-pressed="true"]{background:linear-gradient(135deg,#6cc3e0,#3a93c6)}
.sz[data-s="autumn"][aria-pressed="true"]{background:linear-gradient(135deg,#f0a04b,#d4602a)}
.sz[data-s="winter"][aria-pressed="true"]{background:linear-gradient(135deg,#9fb6cc,#6b87a6)}
.sz[aria-pressed="true"] span{color:#fff;opacity:.85}
@media (max-width:640px){
  .hero{padding:22px 20px;min-height:0}
  .hero::before{background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 94%,transparent) 0%,color-mix(in srgb,var(--paper) 82%,transparent) 62%,color-mix(in srgb,var(--paper) 30%,transparent) 100%)}
  .seasons{width:100%;justify-content:space-between}
  .sz{flex:1;width:auto;height:56px;border-radius:999px}
}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.05);border-radius:999px;padding:11px 18px;font-size:17px;font-weight:500;display:flex;align-items:center;gap:8px;transition:all .25s}
.chip small{font-size:13px;color:var(--mist);font-weight:400;font-variant-numeric:tabular-nums}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.chip.easychip{background:var(--leaf-soft);gap:6px}
.chips.feat{padding-top:0;align-items:center}
.feat-l{flex:none;font-size:14px;font-weight:700;color:var(--ink-soft);padding:0 4px 0 2px}
.tag.x{background:var(--gold-soft);color:var(--gold)}
.chip.easychip[aria-pressed="true"]{background:var(--leaf);color:#fff}
.tag.e{background:var(--leaf-soft);color:var(--leaf)}
.acc{display:grid;gap:8px}
.acc div{display:flex;gap:10px;align-items:flex-start;font-size:17px}
.acc b{flex:none;width:52px;font-size:14px;color:var(--ink-soft);font-weight:500;padding-top:2px}
.acc .unk{color:var(--mist)}

.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.chips{flex-wrap:wrap;overflow:visible;gap:7px}.chip{padding:9px 14px;font-size:16px}}

/* map */
.mapcard{position:relative;background:var(--sea);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
#map{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;background:var(--paper);border-radius:999px;box-shadow:var(--shadow);overflow:hidden}
.zoomctl button{border:0;background:transparent;width:44px;height:44px;font-size:22px;line-height:1}
.zoomctl button+button{border-top:1px solid var(--line)}
@media (max-width:520px){.maplegend{bottom:64px}}
.prov{fill:var(--land);stroke:var(--border-land);stroke-width:.9;transition:fill 1.2s ease,opacity .6s;cursor:pointer}
.prov.alt{fill-opacity:.8}
.prov.dim{opacity:.35}
.prov:hover{fill-opacity:.68}
.rlabel{font-family:var(--f);font-weight:800;fill:var(--ink);opacity:.22;pointer-events:none;transition:opacity .5s;letter-spacing:-.04em}
.zoomed .rlabel{opacity:0}
.mk{cursor:pointer}
.mk .in{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;transition:transform .25s}
.mk:hover .in{transform:scale(1.25)}
.mk .lbl{font-family:var(--f);font-weight:500;font-size:8.4px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:2.6px;stroke-linejoin:round;opacity:0;transition:opacity .4s;pointer-events:none}
.zoomed .mk .lbl{opacity:1}
.mk.hide{display:none}
.ring{fill:none;stroke:var(--lotus);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes pop{from{transform:scale(0);opacity:.2}to{transform:scale(1);opacity:1}}
@keyframes ring{from{transform:scale(.8);opacity:.9}to{transform:scale(2.4);opacity:0}}
.maplegend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px;background:color-mix(in srgb,var(--paper) 92%,transparent);padding:5px;border-radius:999px;max-width:calc(100% - 20px);box-shadow:var(--shadow)}
.lg{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .25s}
.lg i{display:inline-block;width:11px;height:11px}
.lg[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pbtn{border:0;background:var(--bg);border-radius:999px;padding:6px 14px;font-size:15px;color:var(--ink-soft);transition:all .25s}
.pbtn b{color:var(--ink)}
.pbtn:hover{transform:translateY(-1px)}
.pbtn[data-f="v"][aria-pressed="true"]{background:var(--lotus);color:#fff}
.pbtn[data-f="w"][aria-pressed="true"]{background:var(--leaf);color:#fff}
.pbtn,.lg{display:inline-flex;align-items:center;gap:6px}
.ic{display:inline-flex;line-height:0}
.pbtn[aria-pressed="true"] b{color:#fff}
.mapback{position:absolute;right:12px;top:12px;border:0;background:var(--paper);border-radius:999px;padding:10px 16px;font-size:15px;font-weight:500;box-shadow:var(--shadow)}
.maptitle{position:absolute;left:18px;top:14px;font-size:20px;font-weight:800;pointer-events:none;letter-spacing:-.03em}

/* side */
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--paper);border-radius:28px;box-shadow:var(--shadow);padding:22px}
.card h2{font-size:21px;margin:0 0 4px;font-weight:800;letter-spacing:-.03em}
.eyebrow{font-size:14px;font-weight:700;color:var(--celadon);letter-spacing:.02em}
.muted{color:var(--ink-soft);font-size:15px}

.progress{display:flex;align-items:center;gap:18px}
.ringwrap{position:relative;width:100px;height:100px;flex:none}
.ringwrap svg{width:100px;height:100px;transform:rotate(-90deg)}
.ringwrap .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ringwrap .num b{font-size:30px;line-height:1;font-weight:800;color:var(--seal)}
.ringwrap .num span{font-size:13px;color:var(--ink-soft)}
#ringFg{transition:stroke-dashoffset 1.2s cubic-bezier(.3,.8,.3,1)}
.rank{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--lotus);background:var(--lotus-soft);border-radius:999px;padding:4px 12px;margin-bottom:6px}
.rank.up{animation:rankup .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes rankup{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:15px;color:var(--ink-soft)}
.pstats b{font-variant-numeric:tabular-nums;color:var(--ink)}
.nextrank{font-size:14px;color:var(--mist);margin-top:2px}

/* recommend */
.rec{perspective:1200px}
.rec-inner{transition:transform .6s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.rec-inner.flip{transform:rotateY(90deg)}
.rec-scene{border-radius:18px;overflow:hidden;line-height:0;margin:12px 0}
.rec-scene svg{width:100%;height:auto}
.rec-name{font-size:26px;font-weight:800;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;letter-spacing:-.03em}
.rec-name small{font-size:15px;color:var(--mist);font-weight:400;letter-spacing:0}
.why{background:var(--gold-soft);border-radius:14px;padding:10px 14px;margin:10px 0 14px;font-size:16px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:16px;padding:12px 18px;min-height:50px;font-size:17px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--celadon);color:#fff}
.btn.ghost{background:var(--celadon-soft)}
.btn.seal{background:var(--lotus);color:#fff}
.btn.gold{background:var(--gold-soft)}
.btn.lotus{background:var(--lotus-soft);color:var(--ink)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.leafb{background:var(--leaf-soft)}
.btn[aria-pressed="true"].wishbtn{background:var(--leaf);color:#fff}
.next{display:flex;gap:12px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.next .badge{flex:none;width:44px;height:44px;border-radius:14px;background:var(--celadon-soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--celadon);font-size:19px}
.next button{background:none;border:0;padding:0;text-align:left;font-size:16px}
.next button b{font-size:18px}

/* list */
.tabs{display:flex;gap:6px;background:var(--bg);border-radius:16px;padding:5px;margin:12px 0}
.tab{flex:1;border:0;background:transparent;border-radius:12px;padding:10px 6px;font-size:16px}
.tab[aria-pressed="true"]{background:var(--paper);box-shadow:var(--shadow);font-weight:700}
.search{width:100%;font-size:17px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:2px;max-height:560px;overflow-y:auto;margin-top:8px;padding-right:2px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:0;background:transparent;text-align:left;padding:11px 10px;border-radius:16px;transition:background .2s,transform .2s}
.row:hover{background:var(--bg);transform:translateX(3px)}
.row .dot{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;background:var(--celadon-soft);color:var(--celadon)}
.row.v .dot{background:var(--lotus);color:#fff}
.row.w .dot{background:var(--leaf);color:#fff}
.row .nm{font-size:18px;font-weight:700;display:block}
.row .ad{font-size:14px;color:var(--ink-soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:13px;border-radius:999px;padding:3px 10px;white-space:nowrap;font-weight:500}
.tag.v{background:var(--lotus-soft);color:var(--lotus)}
.tag.w{background:var(--leaf-soft);color:var(--leaf)}
.empty{padding:24px 8px;text-align:center;color:var(--ink-soft)}

/* section heads */
.sec{margin-top:32px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-head h2{font-size:28px;font-weight:800;margin:0;letter-spacing:-.04em}

/* footprints */
.trail{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.foot{flex:none;width:230px;scroll-snap-align:start;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;border:0;padding:0;text-align:left;transition:transform .25s}
.foot:hover{transform:translateY(-4px) rotate(-.5deg)}
.foot .pic{aspect-ratio:4/3;max-width:100%;line-height:0;background:var(--bg);position:relative}
.foot .pic svg,.foot .pic img{width:100%;height:100%;object-fit:cover;display:block}
.foot .pic .mini{position:absolute;right:10px;bottom:-14px;width:42px;height:42px;border-radius:50%;background:var(--paper);box-shadow:0 3px 10px rgba(0,0,0,.15);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;transform:rotate(-8deg);box-shadow:inset 0 0 0 2.5px var(--paper)}
.foot .tx{padding:16px 16px 16px}
.foot .dt{font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}
.foot .fn{font-size:19px;font-weight:800;letter-spacing:-.03em}
.foot .memo{font-size:14px;color:var(--ink-soft);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trail-empty{background:var(--paper);border-radius:22px;padding:28px 22px;text-align:center;color:var(--ink-soft);box-shadow:var(--shadow);width:100%}

/* stamp book */
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.rbox{background:var(--paper);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.rbox h3{margin:0;font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.03em}
.rbox h3 small{font-size:15px;color:var(--ink-soft);font-weight:400;font-variant-numeric:tabular-nums}
.rbar{height:8px;border-radius:8px;background:var(--bg);margin:10px 0 14px;overflow:hidden}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lotus),var(--seal));border-radius:8px;transition:width 1s cubic-bezier(.3,.8,.3,1)}
.seals{display:flex;flex-wrap:wrap;gap:10px 8px}

textarea{width:100%;min-height:90px;font-size:17px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.links{display:flex;flex-wrap:wrap;gap:8px}

.sec-t{font-weight:800;font-size:18px;margin:0 0 8px;letter-spacing:-.03em}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.photos .rm{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:1}

.upl b{font-size:28px;font-weight:400;color:var(--lotus);line-height:1}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.note{font-size:14px;color:var(--mist)}

.lightbox{position:fixed;inset:0;z-index:70;background:rgba(10,14,13,.92);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .3s ease}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
@keyframes fade{from{opacity:0}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--ink);color:var(--paper);padding:14px 22px;border-radius:18px;font-size:17px;z-index:60;transition:transform .45s cubic-bezier(.2,1.2,.4,1);max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

      <button class="sz" data-s="winter" aria-pressed="false"><b>冬</b><span>겨울</span></button>

  <div class="loginbar" id="loginbar" hidden></div>

      <div class="pickbar" id="pickbar" hidden><span>추가할 절 자리를 지도에서 눌러주세요.<br><small style="opacity:.75">위 지역 버튼으로 확대하면 더 정확해요</small></span><button id="pickCancel">취소</button></div>
      <div class="maplegend" role="group" aria-label="지도에 보일 사찰">

const PAD=14; const FULL=[bx0-PAD,by0-PAD,bx1-bx0+PAD*2,by1-by0+PAD*2];

  el('rect',{x:FULL[0]-200,y:FULL[1]-200,width:FULL[2]+400,height:FULL[3]+400,fill:'url(#waves)'},svg);
  const land=el('g',{id:'land',filter:'url(#brush)'},svg);
  const alt={gw:1,jl:1,jj:1};

(()=>{const pts=new Map();let start=null,moved=false;
  svg.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;start={vb:vb.slice(),pts:new Map([...pts].map(([k,v])=>[k,{...v}]))};});

      const d0=Math.hypot(st[0].x-st[1].x,st[0].y-st[1].y)||1, d1=Math.hypot(cur[0].x-cur[1].x,cur[0].y-cur[1].y)||1;
      const k=d1/d0, c0x=(st[0].x+st[1].x)/2, c0y=(st[0].y+st[1].y)/2, c1x=(cur[0].x+cur[1].x)/2, c1y=(cur[0].y+cur[1].y)/2;

function dayShuffle(arr){const d=new Date();let seed=d.getFullYear()*400+d.getMonth()*32+d.getDate();const a=arr.slice();for(let i=a.length-1;i>0;i--){seed=(seed*9301+49297)%233280;const j=Math.floor(seed/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.sort((x,y)=>(mk(y.id).w?1:0)-(mk(x.id).w?1:0));}

/* ---------- scene illustration ---------- */
function rng(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000}}
const PAL={
  spring:{sky:['#f8e3ea','#e2f0f4'],sun:'#fff3d6',m:['#cddcc8','#abc9a4','#88b281'],tree:['#f4c3d0','#f8dbe3','#eaa6bb','#fbe9ee'],roof:'#3d4b48'},
  summer:{sky:['#bfe0ef','#ecf7f3'],sun:'#fff8dc',m:['#a3c6b3','#72a789','#4d8665'],tree:['#3f7d4f','#5c9b5f','#2f6a45','#79b06b'],roof:'#33403d'},
  autumn:{sky:['#f5d8b5','#fbefe3'],sun:'#f6b16a',m:['#dbb892','#cc8d5f','#a9663e'],tree:['#d9482b','#e9822e','#f0b53a','#b8321f','#c75a2a'],roof:'#3a3532'},
  winter:{sky:['#d2dce5','#f0f4f7'],sun:'#f6f8fa',m:['#e1e8ee','#cbd5de','#b0bdc8'],tree:['#f6f8fa','#e4eaef','#d2dbe2'],roof:'#4a5258'}
};
function scene(t,s,W,H,slice){
  const R=rng(t.id), P=PAL[s]; const id='g'+t.id+s+W+(slice?'s':'');
  let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="${NS}" ${slice?'preserveAspectRatio="xMidYMid slice"':''} role="img" aria-label="${t.n} ${SEASON_KO[s]} 풍경 그림"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.sky[0]}"/><stop offset="1" stop-color="${P.sky[1]}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id})"/>`;
  const hero=W/H>2.5;
  o+=`<circle cx="${W*(hero?.82:.15+R()*.7)}" cy="${H*(.18+R()*.12)}" r="${H*.09}" fill="${P.sun}" opacity=".9"/>`;
  const ridge=(base,amp,col,ph)=>{let d=`M0 ${H}`;for(let x=0;x<=W;x+=W/48){const y=base-amp*(Math.sin(x/W*Math.PI*(1.4+ph)+ph*7)*.6+Math.sin(x/W*Math.PI*4.3+ph*3)*.25+Math.sin(x/W*Math.PI*9+ph)*.1);d+=` L${x.toFixed(1)} ${y.toFixed(1)}`}return `<path d="${d} L${W} ${H}Z" fill="${col}"/>`};
  o+=ridge(H*.45,H*.16,P.m[0],R()*3)+ridge(H*.6,H*.13,P.m[1],R()*3);
  if(s==='winter') o+=`<path d="M0 ${H*.42} Q${W*.3} ${H*.3} ${W*.6} ${H*.4} T${W} ${H*.36}" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/>`;
  const gy=H*.8; o+=ridge(gy,H*.05,P.m[2],R()*3);
  const cx=hero?W*.74:W*(.38+R()*.24), bw=hero?H*.62:W*.26, by=gy-H*.02;
  const pag=hero||R()>.45, px2=hero?cx-bw*.95:cx+(R()>.5?1:-1)*bw*.85;
  const hallH=H*.15;
  o+=`<rect x="${cx-bw*.55}" y="${by}" width="${bw*1.1}" height="${H*.05}" fill="#bfb6a8"/>`;
  o+=`<rect x="${cx-bw*.42}" y="${by-hallH}" width="${bw*.84}" height="${hallH}" fill="#efe6d2"/>`;
  for(let i=0;i<=4;i++){const x=cx-bw*.42+i*bw*.84/4;o+=`<rect x="${x-2}" y="${by-hallH}" width="4" height="${hallH}" fill="#8e2f22"/>`}
  o+=`<rect x="${cx-bw*.42}" y="${by-hallH}" width="${bw*.84}" height="${hallH*.18}" fill="#2f6a5c"/>`;
  const ry=by-hallH-2, rw=bw*1.25;
  o+=`<path d="M${cx-rw/2-10} ${ry-2} Q${cx-rw/2+2} ${ry+6} ${cx-rw/2+16} ${ry+1} L${cx-rw*.3} ${ry-hallH*.55} Q${cx} ${ry-hallH*.72} ${cx+rw*.3} ${ry-hallH*.55} L${cx+rw/2-16} ${ry+1} Q${cx+rw/2-2} ${ry+6} ${cx+rw/2+10} ${ry-2} Q${cx} ${ry-8} ${cx-rw/2-10} ${ry-2}Z" fill="${P.roof}"/>`;
  if(s==='winter') o+=`<path d="M${cx-rw*.3} ${ry-hallH*.55} Q${cx} ${ry-hallH*.78} ${cx+rw*.3} ${ry-hallH*.55}" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>`;
  if(pag){let tw=bw*.32,y=by;for(let i=0;i<4;i++){const th=H*.05;o+=`<rect x="${px2-tw/2}" y="${y-th}" width="${tw}" height="${th*.62}" fill="#b9b2a5"/><rect x="${px2-tw*.62}" y="${y-th-2}" width="${tw*1.24}" height="4" fill="#9a9285"/>`;if(s==='winter')o+=`<rect x="${px2-tw*.62}" y="${y-th-4}" width="${tw*1.24}" height="2.5" fill="#fff"/>`;y-=th;tw*=.82}o+=`<rect x="${px2-1.5}" y="${y-10}" width="3" height="10" fill="#9a9285"/>`;}
  const nT=hero?22:9+Math.floor(R()*5);
  for(let i=0;i<nT;i++){
    const x=hero?W*.4+R()*W*.6:R()*W; if(Math.abs(x-cx)<bw*.6||Math.abs(x-px2)<bw*.2) continue;
    const y=gy+R()*H*.12-4, r=H*(.045+R()*.05);
    o+=`<rect x="${x-1.5}" y="${y}" width="3" height="${r*.9}" fill="#5a4636"/>`;
    for(let k=0;k<3;k++) o+=`<circle cx="${(x+(R()-.5)*r).toFixed(1)}" cy="${(y-R()*r*.6).toFixed(1)}" r="${(r*(.55+R()*.4)).toFixed(1)}" fill="${P.tree[Math.floor(R()*P.tree.length)]}"/>`;
  }
  const nP=hero?60:14;
  if(s==='winter'){for(let i=0;i<nP*2;i++)o+=`<circle cx="${(R()*W).toFixed(1)}" cy="${(R()*H).toFixed(1)}" r="${(1+R()*2).toFixed(1)}" fill="#fff" opacity=".85"/>`}
  if(s==='autumn'){for(let i=0;i<nP;i++)o+=`<circle cx="${(R()*W).toFixed(1)}" cy="${(gy+R()*H*.18).toFixed(1)}" r="${(1.5+R()*2).toFixed(1)}" fill="${P.tree[i%P.tree.length]}"/>`}
  if(s==='spring'){for(let i=0;i<nP;i++){const ex=(R()*W).toFixed(1),ey=(R()*H*.8).toFixed(1);o+=`<ellipse cx="${ex}" cy="${ey}" rx="3.2" ry="1.8" fill="#f2b6c7" opacity=".85" transform="rotate(${(R()*180).toFixed(0)} ${ex} ${ey})"/>`}}
  return o+'</svg>';
}

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,1100/Math.max(bmp.width,bmp.height));

    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.72));
  }catch(e){return file}
}

}

    ${pet(0,'var(--lotus)',.8,1.08)}
    <circle class="sd" cx="0" cy="-10" r="7" fill="#ffd66b"/>${sparks}</g></svg><p>${name}에 연꽃이 피었어요</p>`;
  document.body.appendChild(el);
  setTimeout(()=>el.classList.add('out'),2500); setTimeout(()=>el.remove(),3200);
}
let toastT; function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600)}

  {n:'4대 관음성지',d:'바다를 바라보는<br>관세음보살 기도처 네 곳이에요.',ids:['naksan','bomun','bori','hyangil']},
  {n:'5대 적멸보궁',d:'부처님 진신사리를 모신 다섯 성지예요.<br>그래서 법당에 불상이 없어요.',ids:['tongdo','sangwon','bongjeongam','beopheung','jeongam']},
  {n:'세계유산 산사',d:'유네스코 세계유산<br>"산사, 한국의 산지승원" 일곱 곳이에요.',ids:['tongdo','buseok','bongjeong','beopju','magok','seonam','daeheung']}

function renderCourses(){

}
$('#courses').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openSheet(b.dataset.id)});

/* ---------- custom temples ---------- */
let picking=false, draft=null;
const clean=v=>String(v||'').replace(/[<>&"`]/g,'').trim().slice(0,60);
function addTemple(c){
  const t=Object.assign({h:'',w:{},d:'주유니가 직접 추가한 절이에요.',custom:true},c);
  t.s=Object.keys(t.w); T.push(t); byId[t.id]=t;
  if($('#markers')) {makeMarker(t,0); placeMarkers();}
  return t;
}
function removeCustom(id){
  const t=byId[id]; if(!t) return;
  S.custom=(S.custom||[]).filter(c=>c.id!==id); delete S.marks[id];
  T.splice(T.indexOf(t),1); delete byId[id]; t._g&&t._g.remove();
  save(); closeSheet(); renderAll(); toast(t.n+'을(를) 목록에서 지웠어요');
}
function openAdd(){
  lastFocus=document.activeElement; openId='__add';
  renderAdd(); const sh=$('#sheet'), bd=$('#backdrop');
  sh.hidden=false; bd.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{sh.classList.add('on');bd.classList.add('on');}));
  sh.scrollTop=0;
}
function renderAdd(){
  draft=draft||{n:'',r:'gg',t:'',a:''};
  const sh=$('#sheet'); const has=draft.la!=null;
  sh.innerHTML=`<div class="sheet-body" style="padding-top:28px"><button class="closex" aria-label="닫기">✕</button>
    <div><div class="eyebrow">목록에 없는 절</div><h2 id="sheetTitle" style="margin-top:4px">직접 추가하기</h2></div>
    <div class="field"><label for="fN">절 이름</label><input id="fN" value="${draft.n}" placeholder="예: 동네 약사사" maxlength="40"></div>
    <div class="field"><label>위치</label><div class="locbox ${has?'ok':''}"><span>${has?'지도에서 위치를 골랐어요':'아직 위치를 고르지 않았어요'}</span><button class="btn ${has?'line':'primary'}" id="fPick">${has?'다시 고르기':'지도에서 위치 찍기'}</button></div></div>
    <div class="field"><label for="fR">지역</label><select id="fR">${Object.entries(REG_FULL).map(([k,v])=>`<option value="${k}" ${draft.r===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label for="fA">주소 (몰라도 괜찮아요)</label><input id="fA" value="${draft.a}" placeholder="예: 경기 성남시 ..." maxlength="60"></div>
    <div class="field"><label for="fT">전화번호 (몰라도 괜찮아요)</label><input id="fT" value="${draft.t}" inputmode="tel" placeholder="예: 031-123-4567" maxlength="20"></div>
    <button class="btn seal" id="fSave" style="min-height:58px;font-size:18px">추가하기</button>
  </div>`;
  const keep=()=>{draft.n=$('#fN').value;draft.r=$('#fR').value;draft.a=$('#fA').value;draft.t=$('#fT').value;};
  sh.querySelector('.closex').onclick=()=>{draft=null;closeSheet()};
  $('#fPick').onclick=()=>{keep();startPick();};
  $('#fSave').onclick=()=>{keep();
    if(!clean(draft.n)){toast('절 이름을 적어주세요');$('#fN').focus();return;}
    if(draft.la==null){toast('지도에서 위치를 먼저 골라주세요');return;}
    const c={id:'c'+Date.now(),n:clean(draft.n),r:draft.r,a:clean(draft.a),t:clean(draft.t).replace(/[^0-9-]/g,''),la:+draft.la.toFixed(4),lo:+draft.lo.toFixed(4)};
    S.custom=(S.custom||[]); S.custom.push(c); save();
    const t=addTemple(c); draft=null; renderAll();
    openId=t.id; renderSheet(t.id,false); toast(t.n+'을(를) 지도에 추가했어요');
  };
}
function startPick(){
  closeSheet(); picking=true;
  $('.mapcard').classList.add('picking'); $('#pickbar').hidden=false;
  $('.mapcard').scrollIntoView({behavior:'smooth',block:'center'});
}
function stopPick(){picking=false;$('.mapcard').classList.remove('picking');$('#pickbar').hidden=true;}
function onPick(e){
  if(!picking) return;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  draft.lo=p.x/CX+LON0; draft.la=LAT0-p.y/100;
  const near=T.filter(t=>!t.custom).map(t=>[t,dist(t,{la:draft.la,lo:draft.lo})]).sort((a,b)=>a[1]-b[1])[0];
  if(near) draft.r=near[0].r;
  stopPick(); openAdd();
}
$('#addBtn').addEventListener('click',()=>{draft=null;openAdd();});
$('#pickCancel').addEventListener('click',()=>{stopPick();openAdd();});


/* ---------- seasonal particles ---------- */
const fx=(()=>{
  const cv=$('#fx'), c=cv.getContext('2d'); let W=0,H=0,dpr=1,parts=[],mode='autumn',raf=0;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COL={spring:['#f6b9c9','#f9d3de','#eea2b8','#fff0f4'],autumn:['#d4421f','#e8762a','#efa82f','#b02f1c','#c95a22'],summer:['#d9f28a','#f4f9b0'],winter:['#ffffff']};
  function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0)}
  function count(){const a=W*H/(1200*800);return Math.round({spring:30,summer:24,autumn:26,winter:90}[mode]*Math.max(.45,Math.min(1.3,a)))}
  function make(init){
    const p={x:Math.random()*W,y:init?Math.random()*H:-20-Math.random()*60,rot:Math.random()*6.28,vr:(Math.random()-.5)*.04,ph:Math.random()*6.28,col:COL[mode][Math.floor(Math.random()*COL[mode].length)]};
    if(mode==='winter'){p.s=1+Math.random()*3.2;p.vy=.4+p.s*.25;p.vx=(Math.random()-.5)*.3}
    else if(mode==='autumn'){p.s=8+Math.random()*9;p.vy=.6+Math.random()*.8;p.vx=(Math.random()-.5)*.6}
    else if(mode==='spring'){p.s=4+Math.random()*4;p.vy=.5+Math.random()*.6;p.vx=.3+Math.random()*.5}
    else {p.s=2+Math.random()*2.5;p.vy=(Math.random()-.5)*.3;p.vx=(Math.random()-.5)*.3;if(!init)p.y=Math.random()*H}
    return p;
  }
  function maple(p){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.scale(1,.75+Math.sin(p.ph)*.25);c.fillStyle=p.col;c.beginPath();const s=p.s;
    for(let i=0;i<=50;i++){const a=i/50*Math.PI*2;const lob=Math.pow(Math.abs(Math.cos(a*2.5)),.6);const r=s*(.35+.65*lob)*(a>Math.PI*.35&&a<Math.PI*.65?.5:1);const x=Math.cos(a-Math.PI/2)*r,y=Math.sin(a-Math.PI/2)*r;i?c.lineTo(x,y):c.moveTo(x,y)}
    c.fill();c.strokeStyle=p.col;c.lineWidth=1.2;c.beginPath();c.moveTo(0,0);c.lineTo(0,s*1.05);c.stroke();c.restore()}
  function petal(p){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.scale(1,.6+Math.sin(p.ph)*.4);c.fillStyle=p.col;c.beginPath();const s=p.s;c.moveTo(0,-s);c.bezierCurveTo(s*.9,-s*.6,s*.8,s*.7,0,s);c.bezierCurveTo(-s*.8,s*.7,-s*.9,-s*.6,0,-s);c.fill();c.restore()}
  function draw(){
    c.clearRect(0,0,W,H);
    for(const p of parts){
      p.ph+=.03;
      if(!reduce){
        if(mode==='summer'){p.x+=p.vx+Math.sin(p.ph*.7)*.3;p.y+=p.vy+Math.cos(p.ph*.5)*.3}
        else{p.x+=p.vx+Math.sin(p.ph)*(mode==='winter'?.4:.9);p.y+=p.vy;p.rot+=p.vr}
        if(p.y>H+30||p.x>W+40||p.x<-40){Object.assign(p,make(false));if(mode==='spring')p.x=Math.random()*W-W*.3}
        if(mode==='summer'&&(p.y<-10||p.y>H+10)){p.y=Math.random()*H}
      }
      if(mode==='winter'){c.globalAlpha=.85;c.fillStyle='#fff';c.shadowColor='rgba(120,140,160,.6)';c.shadowBlur=3;c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.fill();c.shadowBlur=0}
      else if(mode==='autumn'){c.globalAlpha=.9;maple(p)}
      else if(mode==='spring'){c.globalAlpha=.85;petal(p)}
      else {const g=.35+.65*Math.max(0,Math.sin(p.ph*1.3));c.globalAlpha=g;c.fillStyle=p.col;c.shadowColor='#e4ff7a';c.shadowBlur=14;c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.fill();c.shadowBlur=0}
    }
    c.globalAlpha=1;
    if(!reduce) raf=requestAnimationFrame(draw);
  }
  function set(m){mode=m;resize();parts=Array.from({length:count()},()=>make(true));cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}
  function burst(){if(reduce)return;const n=mode==='winter'?40:18;for(let i=0;i<n;i++){const p=make(false);p.x=W/2+(Math.random()-.5)*W*.5;p.y=H*.25+(Math.random()-.5)*80;p.vy=-1-Math.random()*2;p.vx=(Math.random()-.5)*4;p.burst=1;parts.push(p);}setTimeout(()=>{parts=parts.filter(p=>!p.burst)},4500);
    const grav=()=>{parts.forEach(p=>{if(p.burst){p.vy=Math.min(p.vy+.06,2);p.vx*=.98}});if(parts.some(p=>p.burst))requestAnimationFrame(grav)};grav();}
  addEventListener('resize',()=>{resize();placeMarkers()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else if(!reduce)raf=requestAnimationFrame(draw)});
  return {set,burst};
})();
